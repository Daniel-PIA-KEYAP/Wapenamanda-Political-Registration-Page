<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Candidate Registration</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 20px; background: #f9f9f9; }
    h1 { color: #2c3e50; }
    .section { border: 1px solid #ccc; padding: 15px; margin-top: 20px; background: #fff; border-radius: 4px; max-width: 480px; }
    label { display: block; margin-top: 10px; }
    input, select { width: 100%; padding: 6px; margin-top: 4px; box-sizing: border-box; }
    button { margin-top: 16px; padding: 10px 24px; background: #2c3e50; color: #fff; border: none; border-radius: 4px; cursor: pointer; font-size: 15px; }
    button:hover { background: #1a252f; }
    .msg { margin-top: 12px; font-weight: bold; }
  </style>
</head>
<body>
  <h1>Candidate Registration</h1>

  <div class="section">
    <form id="candidateForm" action="candidate_register.php" method="POST">
      <label>Name: <input type="text" name="name" required></label>
      <label>Council Ward: <input type="text" name="ward" required></label>
      <label>Constituency:
        <select name="constituency" required>
          <option value="">-- Select --</option>
          <option value="Tsak">Tsak</option>
          <option value="Wapenamanda">Wapenamanda</option>
        </select>
      </label>
      <label>Email: <input type="email" name="email" required></label>
      <label>Password: <input type="password" name="password" required minlength="8"></label>
      <button type="submit">Register as Candidate</button>
    </form>
    <div id="candidateMsg" class="msg"></div>
  </div>

  <p><a href="login.html">Already registered? Log in &rarr;</a></p>

  <script>
    document.getElementById('candidateForm').addEventListener('submit', function(e) {
      e.preventDefault();
      const formData = new FormData(this);
      fetch('candidate_register.php', { method: 'POST', body: formData })
        .then(res => res.json())
        .then(data => {
          const msg = document.getElementById('candidateMsg');
          if (data.status === 'success') {
            msg.style.color = 'green';
            msg.textContent = data.message;
            this.reset();
          } else {
            msg.style.color = 'red';
            msg.textContent = data.message || 'Registration failed.';
          }
        })
        .catch(() => {
          document.getElementById('candidateMsg').textContent = 'Network error.';
        });
    });
  </script>
</body>
</html>
